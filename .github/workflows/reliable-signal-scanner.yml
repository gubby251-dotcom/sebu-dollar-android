
name: SEBU DOLLAR AI M5 Automatic SNR Scanner

on:
  workflow_dispatch:
  push:
    branches:
      - main
  schedule:
    - cron: "7 */6 * * *"

permissions:
  contents: read
  actions: write

concurrency:
  group: sebu-auto-m5-snr-scanner
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Firebase Admin
        run: npm install --no-save firebase-admin

      - name: Run M5 Scanner and TP SL Status Monitor
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -u

          START_TIME=$(date +%s)
          RUNTIME_LIMIT=$((340 * 60))
          POLL_SECONDS=20
          NEXT_WORKFLOW="reliable-signal-scanner.yml"

          echo "SEBU DOLLAR AI — M5 SNR SCANNER"
          echo "M5 scanner poll: ${POLL_SECONDS}s"

          while true; do
            NOW=$(date +%s)
            ELAPSED=$((NOW - START_TIME))

            if [ "$ELAPSED" -ge "$RUNTIME_LIMIT" ]; then
              echo "Menjadwalkan runner berikutnya..."

              if gh workflow run "$NEXT_WORKFLOW" \
                --repo "${{ github.repository }}" \
                --ref main; then
                echo "Handoff berhasil."
              else
                echo "PERINGATAN: handoff gagal."
              fi

              break
            fi

            echo "----------------------------------------"
            echo "Check: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"

            if node scanner/m5-auto-scanner.mjs; then
              echo "M5 scanner selesai."
            else
              echo "M5 scanner error; akan dicoba kembali."
            fi

            if node scanner/status-monitor.mjs; then
              echo "Status monitor selesai."
            else
              echo "Status monitor error; akan dicoba kembali."
            fi

            sleep "${POLL_SECONDS}"
          done
