name: SEBU DOLLAR AI Reliable M30 Realtime Scanner

on:
  workflow_dispatch:
  push:
    branches:
      - main
  schedule:
    - cron: "7 */6 * * *"

permissions:
  contents: read
  actions: write

concurrency:
  group: sebu-realtime-m30-scanner
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Firebase Admin
        run: npm install --no-save firebase-admin

      - name: Run Scanner and TP SL Status Monitor
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -u

          START_TIME=$(date +%s)
          RUNTIME_LIMIT=$((340 * 60))
          POLL_SECONDS=20
          NEXT_WORKFLOW="reliable-signal-scanner.yml"

          echo "SEBU DOLLAR AI — SCANNER + TP/SL STATUS MONITOR"
          echo "Scanner poll: ${POLL_SECONDS}s"

          while true; do
            NOW=$(date +%s)
            ELAPSED=$((NOW - START_TIME))

            if [ "$ELAPSED" -ge "$RUNTIME_LIMIT" ]; then
              echo "Runner mendekati batas; menjadwalkan runner berikutnya..."

              if gh workflow run "$NEXT_WORKFLOW" \
                --repo "${{ github.repository }}" \
                --ref main; then
                echo "Handoff runner berikutnya berhasil dijadwalkan."
              else
                echo "PERINGATAN: handoff gagal; backup schedule menjadi cadangan."
              fi

              break
            fi

            echo "----------------------------------------"
            echo "Check: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"

            if node scanner/reliable-index.mjs; then
              echo "Scanner check selesai."
            else
              echo "Scanner error; akan dicoba kembali."
            fi

            if node scanner/status-monitor.mjs; then
              echo "Status monitor selesai."
            else
              echo "Status monitor error; akan dicoba kembali."
            fi

            sleep "${POLL_SECONDS}"
          done
