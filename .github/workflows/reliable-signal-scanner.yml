name: SEBU DOLLAR AI Reliable Signal Scanner

on:
  workflow_dispatch:

  schedule:
    - cron: "3/5 * * * *"

permissions:
  contents: read

concurrency:
  group: sebu-reliable-signal-scanner
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest

    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Firebase Admin
        run: npm install --no-save firebase-admin

      - name: Run Reliable M30 Scanner
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node scanner/reliable-index.mjs
