name: SEBU DOLLAR AI Signal Push

on:
  workflow_dispatch:

  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: sebu-signal-scanner
  cancel-in-progress: false

jobs:
  scan-and-notify:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Firebase Admin
        run: npm install --no-save firebase-admin

      - name: Scan M30 and send FCM
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node scanner/index.mjs

      - name: Save scanner checkpoint
        run: |
          if ! git diff --quiet -- .github/scanner-state.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

            git add .github/scanner-state.json

            git commit -m "chore: update signal scanner checkpoint [skip ci]"

            git push
          else
            echo "No scanner state changes."
          fi
